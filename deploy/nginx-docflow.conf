# nginx config สำหรับ docflow.nvxthai.dev → reverse proxy ไป Next.js (port 3100)
#
# วางที่: /etc/nginx/sites-available/docflow.nvxthai.dev
# แล้ว symlink: ln -s /etc/nginx/sites-available/docflow.nvxthai.dev /etc/nginx/sites-enabled/
#
# ⚠️ ไฟล์นี้เป็นของ docflow เท่านั้น — ไม่แตะ config เว็บอื่นใน sites-enabled/
#
# ขั้นตอน SSL: ตั้ง block HTTP ด้านล่างก่อน แล้วรัน certbot ซึ่งจะเติม SSL block ให้อัตโนมัติ
#   sudo certbot --nginx -d docflow.nvxthai.dev

server {
    listen 80;
    listen [::]:80;
    server_name docflow.nvxthai.dev;

    # ขนาด upload สูงสุด (ให้ตรง/มากกว่า MAX_UPLOAD_SIZE = 50MB)
    client_max_body_size 55M;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # cache static assets ของ Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
